<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <g fill="none" stroke="#8a9e85" stroke-linecap="round" stroke-linejoin="round" opacity="0.88">

    <!-- Main horizontal stem along top edge -->
    <path stroke-width="1.5" d="M 8 8 C 30 11 65 11 112 13"/>
    <!-- Main vertical stem along left edge -->
    <path stroke-width="1.5" d="M 8 8 C 11 30 11 65 13 112"/>

    <!-- Corner flower at (8,8) -->
    <path stroke-width="1.1" d="M 8 8 C 5 4 3 1 5 0 C 7 1 8 5 8 8"/>
    <path stroke-width="1.1" d="M 8 8 C 12 4 14 1 12 0 C 10 1 9 5 8 8"/>
    <path stroke-width="1.1" d="M 8 8 C 4 12 1 14 0 12 C 1 10 5 9 8 8"/>
    <circle cx="8" cy="8" r="2.5" fill="#8a9e85" stroke="none"/>

    <!-- Leaves on horizontal stem — alternating up/down -->
    <path stroke-width="1.1" d="M 28 10 C 25 6 23 2 26 1 C 29 2 30 6 28 10"/>
    <path stroke-width="1.1" d="M 46 11 C 43 15 42 19 45 20 C 48 19 49 15 46 11"/>
    <path stroke-width="1.1" d="M 64 11 C 61 7 60 3 63 2 C 66 3 67 7 64 11"/>
    <path stroke-width="1.1" d="M 82 12 C 79 16 78 20 81 21 C 84 20 85 16 82 12"/>
    <path stroke-width="1.1" d="M 100 13 C 97 9 96 5 99 4 C 102 5 103 9 100 13"/>

    <!-- Leaves on vertical stem — alternating left/right -->
    <path stroke-width="1.1" d="M 10 28 C 6 25 2 23 1 26 C 2 29 6 30 10 28"/>
    <path stroke-width="1.1" d="M 11 46 C 15 43 19 42 20 45 C 19 48 15 49 11 46"/>
    <path stroke-width="1.1" d="M 11 64 C 7 61 3 60 2 63 C 3 66 7 67 11 64"/>
    <path stroke-width="1.1" d="M 12 82 C 16 79 20 78 21 81 C 20 84 16 85 12 82"/>
    <path stroke-width="1.1" d="M 13 100 C 9 97 5 96 4 99 C 5 102 9 103 13 100"/>

    <!-- Berry dots at upward/leftward leaf tips -->
    <circle cx="26" cy="1" r="1.8" fill="#8a9e85" stroke="none"/>
    <circle cx="63" cy="2" r="1.8" fill="#8a9e85" stroke="none"/>
    <circle cx="99" cy="4" r="1.8" fill="#8a9e85" stroke="none"/>
    <circle cx="1" cy="26" r="1.8" fill="#8a9e85" stroke="none"/>
    <circle cx="2" cy="63" r="1.8" fill="#8a9e85" stroke="none"/>
    <circle cx="4" cy="99" r="1.8" fill="#8a9e85" stroke="none"/>

    <!-- End spray on horizontal stem -->
    <path stroke-width="1" d="M 112 13 C 110 9 108 7 110 6"/>
    <path stroke-width="1" d="M 112 13 C 115 9 117 7 116 6"/>
    <path stroke-width="1" d="M 112 13 C 114 16 116 19 114 20"/>

    <!-- End spray on vertical stem -->
    <path stroke-width="1" d="M 13 112 C 9 110 7 108 6 110"/>
    <path stroke-width="1" d="M 13 112 C 9 115 7 117 6 116"/>
    <path stroke-width="1" d="M 13 112 C 16 114 19 116 20 114"/>

  </g>
